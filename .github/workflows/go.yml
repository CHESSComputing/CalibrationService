name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d testdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U postgres -d testdb; do
            sleep 2
          done
        env:
          PGPASSWORD: secret

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database schema
        env:
          PGPASSWORD: secret
        run: |
          psql -h localhost \
               -U postgres \
               -d testdb \
               -f static/schema/schema.sql

      - name: Update foxden.yaml
        run: |
          cat >> foxden.yaml <<'EOF'

          CalibrationData:
            DBUri: postgres://postgres:secret@localhost:5432/testdb?sslmode=disable
            WebServer:
              Name: foxden-calibration-service
              Port: 8399
              Verbose: 1
              LogFile: /tmp/CalibrationService.log
              LogLongFile: true
              GinOptions:
                DisableConsoleColor: true
          EOF

      - name: Build
        run: make

      - name: Test
        run: make test
